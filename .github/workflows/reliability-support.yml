name: Reliability and Support Regressions

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/v2.0.3-reliability-support']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install development regression dependencies
        run: python -m pip install -r requirements.txt 'cryptography==46.0.7' pillow
      - name: Test recovery, privacy and checksum failure paths
        run: python -m unittest discover -s tests -p test_reliability.py -v
      - name: Compile Python with syntax warnings rejected
        run: python -W error::SyntaxWarning -m compileall -q -f .
      - name: Run existing development regression groups
        run: python -u tests/run_development_regressions.py
      - name: Verify pinned WebView2 SDK and test the native host lifecycle
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'webview2-sdk.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'webview2-sdk'
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.4191.47' -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f492bbf547d0da329553b6727435b677579b1e9f91cc9e4a1ad029366d5f23d0') {
            throw 'Pinned WebView2 SDK checksum mismatch'
          }
          Expand-Archive -LiteralPath $package -DestinationPath $sdk
          ./tests/run_native_reliability.ps1 -SdkDirectory $sdk -OutputDirectory (Join-Path $env:RUNNER_TEMP 'native-reliability')
