name: Bug report
description: Report a reproducible Bitcoin Miner Studio problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Bitcoin Miner Studio. Remove sensitive information before submitting logs or screenshots. Never include wallet private keys, seed phrases, RPC passwords, pool credentials, signing keys, or API tokens.

  - type: input
    id: version
    attributes:
      label: Bitcoin Miner Studio version
      description: "Example: 2.0.2"
      placeholder: "2.0.2"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime or build type
      options:
        - Windows portable release
        - Running from source
        - Native WebView2 release build
        - Other
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Include edition and build if known.
      placeholder: Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Dashboard / UI
        - CPU mining
        - ASIC management
        - Bitcoin Core / RPC
        - Stratum / pool connectivity
        - Solo mining
        - Benchmarking
        - Monitoring / telemetry
        - Update & Release Center
        - Security / provenance
        - Windows packaging
        - Settings / profiles
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Open Bitcoin Miner Studio
        2. Go to ...
        3. Configure ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove wallet secrets, RPC credentials, tokens, private keys, payout-sensitive information, and personal data before posting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive information from logs and screenshots.
          required: true
        - label: I can reproduce this issue on the version listed above.
          required: true
