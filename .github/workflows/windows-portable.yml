name: Build Windows x64 Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact repository bytes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12 x64 build host
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Build and verify DIRECT WebView2 portable package
        shell: pwsh
        run: |
          $built = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            try {
              Write-Host "Windows build attempt $attempt of 2..." -ForegroundColor Cyan
              .\build_windows_portable.ps1
              $built = $true
              break
            }
            catch {
              if ($attempt -ge 2) { throw }
              Write-Warning "First WebView2 CI smoke/build attempt failed: $($_.Exception.Message)"
              Write-Host 'Retrying once on a clean build tree because hosted-runner WebView2 startup can be transient.'
              Start-Sleep -Seconds 5
            }
          }
          if (-not $built) { throw 'Windows portable build did not complete.' }

      - name: Finalize DPI-aware Windows runtime and release dependencies
        shell: pwsh
        run: .\finalize_windows_portable.ps1

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinMinerStudio-Windows-x64
          path: release-windows/*
          if-no-files-found: error
          retention-days: 30
