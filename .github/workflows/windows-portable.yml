name: Build Windows x64 Portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact repository bytes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pywebview[pyside6]>=6.2,<7" "pyinstaller>=6.14,<7"

      - name: Apply Qt rendering stability profile
        shell: pwsh
        run: |
          $path = 'build_windows_portable.ps1'
          $content = Get-Content $path -Raw -Encoding UTF8
          $needle = "os.environ['PYWEBVIEW_GUI'] = 'qt'"
          if (-not $content.Contains($needle)) {
            throw 'Could not find the Qt runtime-hook insertion point.'
          }
          $replacement = @"
          os.environ['PYWEBVIEW_GUI'] = 'qt'
          os.environ['QT_OPENGL'] = 'software'
          _flags = os.environ.get('QTWEBENGINE_CHROMIUM_FLAGS', '').strip()
          _stable = '--disable-gpu --disable-gpu-compositing --disable-direct-composition'
          os.environ['QTWEBENGINE_CHROMIUM_FLAGS'] = (_flags + ' ' + _stable).strip()
          "@
          $content = $content.Replace($needle, $replacement.Trim())
          Set-Content -Path $path -Value $content -Encoding UTF8

      - name: Build and verify portable EXE package
        shell: pwsh
        run: .\build_windows_portable.ps1 -SkipInstall

      - name: Optimize Qt portable package
        shell: pwsh
        run: .\optimize_windows_portable.ps1

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinMinerStudio-Windows-x64
          path: release-windows/*
          if-no-files-found: error
          retention-days: 30
