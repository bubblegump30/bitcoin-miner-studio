name: Build Windows x64 Portable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact repository bytes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12 x64 build host
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Build and verify native WebView2 portable package
        shell: pwsh
        run: .\build_windows_portable.ps1

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinMinerStudio-Windows-x64
          path: release-windows/*
          if-no-files-found: error
          retention-days: 30
