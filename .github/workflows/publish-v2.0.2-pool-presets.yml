name: Republish updated v2.0.2 release

# Reissue the verified current package under the existing tag/URL so the
# repository sidebar reflects this updated release's publication date.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v2.0.2-pool-presets.yml]

permissions:
  actions: read
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the current notes
        uses: actions/checkout@v5

      - name: Download and verify exact signed Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=36368411750
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion + " " + .head_sha')
          test "$state" = 'success aecc2ea1a94ea916839bc7ba94e9834670bf1098'
          mkdir -p release-download
          gh run download "$run" --repo "$GITHUB_REPOSITORY" \
            --name BitcoinMinerStudio-Windows-x64 --dir release-download
          cd release-download
          expected=c49fd74aabece672c11a7cd40c2a4dad1ac3ec5a41f81a705fde0c2bbe21a9d7
          actual=$(sha256sum BitcoinMinerStudio-v2.0.2-Windows-x64.zip | cut -d' ' -f1)
          test "$actual" = "$expected"
          grep -Fq "$expected  BitcoinMinerStudio-v2.0.2-Windows-x64.zip" SHA256SUMS-Windows.txt
          python - <<'PY'
          import io,json,zipfile,pathlib
          outer=pathlib.Path('BitcoinMinerStudio-v2.0.2-Windows-x64.zip').read_bytes()
          with zipfile.ZipFile(io.BytesIO(outer)) as package:
              manifest=json.loads(package.read('purple_dragon_manifest.json'))
          assert manifest['version']=='2.0.2' and manifest['signature']
          assert len(manifest['files'])==73
          PY

      - name: Reissue release on the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v2.0.2
          repo="$GITHUB_REPOSITORY"
          # The existing published record has an older timestamp. The tag stays put.
          gh release delete "$tag" --repo "$repo" --yes
          gh release create "$tag" \
            release-download/BitcoinMinerStudio-v2.0.2-Windows-x64.zip \
            release-download/SHA256SUMS-Windows.txt \
            --repo "$repo" --verify-tag --latest \
            --title 'Bitcoin Miner Studio v2.0.2 — Updated Windows Build' \
            --notes-file .github/RELEASE_NOTES_CURRENT.md
