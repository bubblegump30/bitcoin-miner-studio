name: Public Readiness Gate

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-public-readiness:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    steps:
      - name: Check out exact repository bytes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Reject Python syntax warnings and compile failures
        shell: pwsh
        run: |
          python -W error::SyntaxWarning -m compileall -q -f .
          if ($LASTEXITCODE -ne 0) { throw 'Python compile/SyntaxWarning gate failed.' }

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          node --check ui/script.js
          if ($LASTEXITCODE -ne 0) { throw 'ui/script.js syntax validation failed.' }

      - name: Validate portable Python isolation
        shell: pwsh
        run: |
          foreach ($file in @('build_windows_portable.ps1', 'finalize_windows_portable.ps1')) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "$file has PowerShell parse errors: $errors" }
            $writes = $ast.FindAll({ param($node)
              $node -is [System.Management.Automation.Language.AssignmentStatementAst] -and
              $node.Left.Extent.Text -match '^\$env:PYTHON'
            }, $true)
            if ($writes.Count) { throw "$file must not mutate the caller's Python environment" }
          }
          $savedHome = $env:PYTHONHOME
          $savedPath = $env:PYTHONPATH
          try {
            $env:PYTHONHOME = Join-Path $env:RUNNER_TEMP 'nonexistent-portable-runtime'
            $env:PYTHONPATH = $env:PYTHONHOME
            python -E -c "import encodings, sys; assert sys.version_info[:2] == (3, 12); print('Build-host Python ignores inherited runtime paths')"
            if ($LASTEXITCODE -ne 0) { throw 'Build-host Python isolation regression' }
          } finally {
            $env:PYTHONHOME = $savedHome
            $env:PYTHONPATH = $savedPath
          }

      - name: Validate optional pool preset boundaries
        shell: pwsh
        run: |
          node --test tests/pool_presets.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pool preset boundary regressions failed.' }

      - name: Validate v2.0.3 release version alignment
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          info = json.loads(Path('release_info.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('purple_dragon_manifest.json').read_text(encoding='utf-8'))
          version = info['version']
          assert version == manifest['version']
          assert f'VERSION = "{version}"' in Path('webview_app.py').read_text(encoding='utf-8')
          assert f'Bitcoin Miner Studio v{version}' in Path('windows_native_host.cs').read_text(encoding='utf-8')
          assert f'v{version} · UPDATE &amp; RELEASE CENTER' in Path('ui/index.html').read_text(encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release version labels are inconsistent.' }

      - name: Run deterministic public-readiness regressions
        shell: pwsh
        run: |
          @'
          import multiprocessing
          import selftest

          def main():
              tests = [
                  selftest.utility_tests,
                  selftest.bitcoin_core_setup_tests,
                  selftest.pool_powertools_tests,
                  selftest.pool_diagnostics_freshness_tests,
                  selftest.pool_profiles_smart_failover_tests,
                  selftest.webview_startup_dom_contract_tests,
                  selftest.regtest_lab_tests,
                  selftest.asic_solo_bridge_tests,
              ]

              for test in tests:
                  print(f'\n== {test.__name__} ==')
                  test()

              print('\n[PASS] deterministic public-readiness regression set')

          if __name__ == '__main__':
              multiprocessing.freeze_support()
              main()
          '@ | Set-Content -Path .ci-public-readiness.py -Encoding UTF8

          python .ci-public-readiness.py
          $exitCode = $LASTEXITCODE
          Remove-Item .ci-public-readiness.py -Force -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { throw 'Deterministic public-readiness regressions failed.' }

      - name: Validate hardened Stratum URL parser
        shell: pwsh
        run: |
          @'
          from connections import parse_stratum_url

          assert parse_stratum_url('stratum+tcp://example.com:3333') == ('example.com', 3333, False)
          assert parse_stratum_url('stratum+ssl://example.com:443') == ('example.com', 443, True)

          invalid = [
              'http://example.com:3333',
              'stratum+tcp://user:password@example.com:3333',
              'stratum+tcp://example.com:3333/path',
              'stratum+tcp://example.com:3333/?token=secret',
              'stratum+tcp://example.com:70000',
          ]
          for value in invalid:
              try:
                  parse_stratum_url(value)
              except ValueError:
                  continue
              raise AssertionError(f'unsafe/invalid Stratum URL accepted: {value}')

          print('[PASS] hardened Stratum URL validation')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Stratum URL hardening regression failed.' }

      - name: Check release hygiene
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'purple_dragon_manifest.json').read_text(encoding='utf-8'))
          protected = set((manifest.get('files') or {}).keys())
          signer = (root / 'tools' / 'purple_dragon_sign.py').read_text(encoding='utf-8')

          forbidden = []
          for candidate in root.rglob('*.pem'):
              try:
                  if 'PRIVATE KEY' in candidate.read_text(encoding='utf-8', errors='ignore'):
                      forbidden.append(candidate.as_posix())
              except OSError:
                  pass
          assert not forbidden, f'private key material found: {forbidden}'

          assert not (root / 'startup-error.log').exists(), 'startup-error.log must not be committed'
          assert not (root / 'native-backend.log').exists(), 'native-backend.log must not be committed'
          assert manifest.get('version') in {'2.0.2', '2.0.3'}, manifest.get('version')
          required_signer_inputs = {
              'windows_native_bridge.py',
              'windows_native_host.cs',
              'tools/prepare_v2_0_2.py',
              'build_windows_portable.ps1',
              'finalize_windows_portable.ps1',
              'sign_v2_0_2_release.ps1',
          }
          if manifest.get('version') == '2.0.3':
              required_signer_inputs.add('sign_v2_0_3_release.ps1')
          for required in required_signer_inputs:
              assert f'"{required}"' in signer, f'v2.0.2 signer must protect {required}'

          code_like = {
              p.relative_to(root).as_posix()
              for p in root.rglob('*')
              if p.is_file()
              and not p.is_symlink()
              and p.suffix.lower() in {'.py', '.pyw', '.js', '.html', '.css', '.bat', '.cs', '.ps1'}
              and '__pycache__' not in p.parts
              and '.git' not in p.parts
          }
          signer_protected = set()
          in_list = False
          for raw in signer.splitlines():
              line = raw.strip()
              if line.startswith('PROTECTED_FILES') and '[' in line:
                  in_list = True
                  continue
              if in_list and line == ']':
                  break
              if in_list and line.startswith('"') and line.endswith('",'):
                  signer_protected.add(line[1:-2])
          unsigned_code = sorted(code_like - signer_protected)
          assert not unsigned_code, f'unsigned executable/build code surface: {unsigned_code}'

          if manifest.get('signature'):
              for required in required_signer_inputs:
                  assert required in protected, f'signed v2.0.2 manifest must protect {required}'
              expected = 74 if manifest.get('version') == '2.0.3' else 73
              assert len(protected) == expected, f'signed manifest must contain {expected} protected files, got {len(protected)}'
              print('[PASS] signed manifest release-hygiene checks')
          else:
              assert manifest.get('build_id') == 'PENDING-OFFLINE-SIGNATURE'
              print('[PASS] prepared pre-sign release-hygiene checks')

          print('[PASS] publisher private key absent from repository')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release-hygiene gate failed.' }

      - name: Explain expected signing state
        shell: pwsh
        run: |
          Write-Host 'Public-readiness source gate complete.'
          Write-Host 'Full Purple Dragon integrity validation runs after the final manifest is re-signed with the offline publisher private key.'
