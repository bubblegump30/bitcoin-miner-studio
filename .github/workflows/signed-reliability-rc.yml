name: Signed Reliability Windows Release Candidate

on:
  workflow_dispatch:
  push:
    branches: ['release/v2.0.3-reliability-support']
    paths: ['purple_dragon_manifest.json']

permissions:
  contents: read

jobs:
  signed-acceptance:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install release test dependencies
        run: python -m pip install -r requirements.txt 'cryptography==46.0.7' pillow
      - name: Require fresh Purple Dragon publisher trust
        shell: pwsh
        run: |
          @'
          import ast
          import json
          from pathlib import Path
          from purple_dragon_security import verify_integrity
          state = verify_integrity()
          info = json.loads(Path('release_info.json').read_text(encoding='utf-8'))
          tree = ast.parse(Path('tools/purple_dragon_sign.py').read_text(encoding='utf-8'))
          required = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == 'PROTECTED_FILES' for target in node.targets))
          assert str(info['version']).startswith('2.0.3'), 'Prepare the reliability version metadata before publisher signing'
          assert state['trust_level'] == 'TRUSTED' and state['signature_valid'] is True
          assert state['critical_actions_allowed'] is True
          assert state['release_version'] == info['version']
          assert state['verified_file_count'] == state['protected_file_count'] == len(required)
          print('Fresh publisher trust and complete protected surface verified.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Fresh publisher signing is required; stale signatures are not accepted.' }
      - name: Run full signed regression suite
        shell: pwsh
        run: |
          python -W error::SyntaxWarning selftest.py
          if ($LASTEXITCODE -ne 0) { throw 'Signed selftests failed.' }
          python -m unittest discover -s tests -p test_reliability.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Reliability regressions failed.' }
          node --check ui/script.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax failed.' }
          node --test tests/pool_presets.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pool preset regressions failed.' }
      - name: Build and finalize verified native Windows package
        shell: pwsh
        run: |
          ./build_windows_portable.ps1
          ./finalize_windows_portable.ps1
      - name: Upload candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: BitcoinMinerStudio-reliability-signed-candidate
          path: release-windows/*
          if-no-files-found: error
          retention-days: 14
