name: Simplify v2.0.2 GitHub release

# One-time cleanup. A later edit to this workflow is safe to rerun.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v2.0.2-pool-presets.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify the current download and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag=v2.0.2
          mkdir verified-release
          gh release download "$tag" --repo "$repo" --dir verified-release \
            --pattern 'BitcoinMinerStudio-v2.0.2-Windows-x64.zip' \
            --pattern 'SHA256SUMS-Windows.txt'
          cd verified-release
          expected='c49fd74aabece672c11a7cd40c2a4dad1ac3ec5a41f81a705fde0c2bbe21a9d7'
          actual=$(sha256sum BitcoinMinerStudio-v2.0.2-Windows-x64.zip | cut -d' ' -f1)
          test "$actual" = "$expected"
          grep -Fq "$expected  BitcoinMinerStudio-v2.0.2-Windows-x64.zip" SHA256SUMS-Windows.txt

      - name: Keep one current ZIP and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag=v2.0.2
          for obsolete in \
            BitcoinMinerStudio-v2.0.2-Windows-x64-RC-FINAL-NATIVE-TRAY.zip \
            BitcoinMinerStudio-Windows-build.json; do
            if gh release view "$tag" --repo "$repo" --json assets \
              --jq '.assets[].name' | grep -Fxq "$obsolete"; then
              gh release delete-asset "$tag" "$obsolete" --repo "$repo" --yes
            fi
          done
          cat > notes.md <<'NOTES'
          # Bitcoin Miner Studio v2.0.2

          **Download:** [BitcoinMinerStudio-v2.0.2-Windows-x64.zip](https://github.com/bubblegump30/bitcoin-miner-studio/releases/download/v2.0.2/BitcoinMinerStudio-v2.0.2-Windows-x64.zip)

          Extract the ZIP and run `BitcoinMinerStudio.exe` on Windows 10/11. Microsoft Edge WebView2 Runtime is required. Python is included.

          This updated build adds optional pool presets for Braiins Pool and CKPool Solo. Choosing one previews editable endpoint and fee values; saving, testing, and activation remain separate actions. It also improves Windows packaging and reliability. BTC PoW Lab is deferred pending documented pool terms.

          Verify the ZIP against `SHA256SUMS-Windows.txt`. The extracted app should report **Purple Dragon Security: TRUSTED, 73/73 files verified**. The Windows EXE does not carry a Microsoft Authenticode signature.

          [Changes and documentation](https://github.com/bubblegump30/bitcoin-miner-studio/blob/main/CHANGELOG.md) · [Pool preset notes](https://github.com/bubblegump30/bitcoin-miner-studio/blob/main/docs/POOL_PRESETS.md)
          NOTES
          gh release edit "$tag" --repo "$repo" --notes-file notes.md
